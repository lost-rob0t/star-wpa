name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install wireless adapter dependencies
        run: python3 -m pip install -e . "setuptools>=68" wheel
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated actor and shell-command coverage
        run: python3 scripts/build-tool-actors.py --check
      - name: Prove installed standalone commands
        run: python3 scripts/check-installed-cli.py
      - name: Synchronize structure
        run: python3 scripts/sync.py
      - name: Check synchronization
        run: python3 scripts/sync.py --check
      - name: Validate research control plane
        run: python3 scripts/validate-docs.py
